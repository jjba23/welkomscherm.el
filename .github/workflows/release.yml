# Publishing is the tag: the suite runs from the tagged commit, and that same
# commit's archive becomes the release asset the packaging recipes download.
# Nothing is published from a tree whose tests did not pass.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs 30.1
        uses: purcell/setup-emacs@master
        with:
          version: 30.1

      - name: Run the suite
        run: |
          emacs -Q --batch -L . -L test -l test/welkomscherm-test.el \
            -f ert-run-tests-batch-and-exit

      - name: Build the tarball
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="welkomscherm.el-${version}/" \
            -o "welkomscherm.el-${version}.tar.gz" HEAD

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: welkomscherm.el-*.tar.gz
          generate_release_notes: true
