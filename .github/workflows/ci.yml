# The quality gate from maak.scm, run where maak itself is not installed: the
# suite on every Emacs version the package claims, and the lint gate once, on
# the newest.  A warning only an old byte-compiler emits is not a compatibility
# failure, and the suite is what backs the promise the README makes.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests on Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["27.2", "28.2", "29.4", "30.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs ${{ matrix.emacs }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Byte-compile the package and its suite
        run: |
          emacs -Q --batch -L . -L test \
            -f batch-byte-compile welkomscherm.el test/welkomscherm-test.el

      - name: Run the suite
        run: |
          emacs -Q --batch -L . -L test -l test/welkomscherm-test.el \
            -f ert-run-tests-batch-and-exit

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs 30.1
        uses: purcell/setup-emacs@master
        with:
          version: 30.1

      - name: Byte-compile with warnings turned into errors
        run: |
          emacs -Q --batch -L . -L test \
            --eval "(setq byte-compile-error-on-warn t)" \
            -f batch-byte-compile welkomscherm.el test/welkomscherm-test.el

      - name: Enforce checkdoc
        run: emacs -Q --batch -L . -l test/welkomscherm-checkdoc.el
